<title>Sem 3 Sprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with tabs; one day = a stack of timed subject blocks; the tutor opens as a right-side drawer (full screen on phones) */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#141B26; --muted:#586374; --rule:#D6DCE5;
  --accent:#2B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC; --done:#1C7F53; --done-soft:#DDF2E7; --warn:#A64B12;
  --ps:#0B8585; --daa:#4A4ED0; --com:#C0386A; --be:#2B7F3C; --lr:#A86E12; --aif:#8640C4; --all:#586374;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#151C27; --sunk:#1C2532; --ink:#E5EAF1; --muted:#98A4B6; --rule:#283242;
  --accent:#829BFF; --accent-ink:#0E131B; --accent-soft:#1E2947; --done:#4FC48C; --done-soft:#173326; --warn:#F2A262;
  --ps:#3FC6C6; --daa:#9195FF; --com:#F27DA6; --be:#62C47C; --lr:#E6B24C; --aif:#C38EF2; --all:#98A4B6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#151C27; --sunk:#1C2532; --ink:#E5EAF1; --muted:#98A4B6; --rule:#283242;
  --accent:#829BFF; --accent-ink:#0E131B; --accent-soft:#1E2947; --done:#4FC48C; --done-soft:#173326; --warn:#F2A262;
  --ps:#3FC6C6; --daa:#9195FF; --com:#F27DA6; --be:#62C47C; --lr:#E6B24C; --aif:#C38EF2; --all:#98A4B6;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:21px}
.brand-sub{color:var(--muted);font-size:13px}
.overall{display:flex;align-items:center;gap:10px;min-width:0}
.bar{position:relative;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:1}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--done);border-radius:99px;transition:width .3s}
.overall .bar{width:160px;flex:none}
.overall span{font-size:13px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:20px 64px;display:grid;gap:20px}
main>*,.blocks>*,.subjects>*{min-width:0}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.daychip{flex:none;width:64px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:6px 4px 7px;display:grid;justify-items:center;gap:3px}
.daychip b{font-family:var(--f-display);font-size:16px;line-height:1}
.daychip small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.daychip .mini{width:40px;height:4px;border-radius:9px;background:var(--sunk);overflow:hidden;position:relative}
.daychip .mini>i{position:absolute;inset:0 auto 0 0;background:var(--done)}
.daychip.rev{border-style:dashed}
.daychip.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.daychip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daychip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}

.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayhead h1{font-size:28px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle;margin-left:6px;font-family:var(--f-body);letter-spacing:0}
.pill.now{background:var(--accent);color:var(--accent-ink)}
.loop{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.loop span::before{content:attr(data-n);display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sunk);color:var(--ink);font-size:11px;font-weight:600;margin-right:6px}

/* blocks */
.blocks{display:grid;gap:12px}
.block{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.block-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.block-h .t{min-width:0;flex:1}
.block-h h3{font-size:16px}
.block-h p{margin:0;font-size:12.5px;color:var(--muted)}
.dur{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.topics{list-style:none;margin:0;padding:4px 0}
.topic{display:flex;align-items:center;gap:10px;padding:7px 14px}
.topic+.topic{border-top:1px solid var(--sunk)}
.topic input{width:18px;height:18px;accent-color:var(--done);flex:none;margin:0}
.topic label{flex:1;min-width:0;cursor:pointer}
.topic label small{display:block;font-size:12px;color:var(--muted)}
.topic.done label>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.tag-note{font-size:11px;color:var(--done);background:var(--done-soft);padding:1px 7px;border-radius:99px;white-space:nowrap}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.no-agent .btn-agent{display:none}
.review-rows{padding:8px 14px 12px;display:grid;gap:8px;font-size:13.5px}
.review-rows .r{display:grid;gap:2px}
.review-rows .r b{font-weight:600;font-size:12px;color:var(--muted)}
.block-foot{padding:0 14px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* plan table */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
table.plan{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
.plan th,.plan td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--rule)}
.plan thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);position:sticky;top:0}
.plan tbody tr{cursor:pointer}
.plan tbody tr:hover{background:var(--accent-soft)}
.plan td.d{white-space:nowrap;font-weight:600}
.plan td.d small{display:block;font-weight:400;color:var(--muted)}
.plan td .x{color:var(--muted)}
.plan .hd{display:inline-flex;align-items:center;gap:6px}
.plan .cell-done{color:var(--done)}

/* subjects */
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.subjects{grid-template-columns:1fr}}
.subj{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start}
.subj-h{display:flex;gap:10px;align-items:center}
.subj-h h3{font-size:17px;flex:1;min-width:0}
.subj .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.subj details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
.subj details .unit{margin-top:10px}
.subj details .unit h4{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:600}
.subj .topics .topic{padding:5px 0}

/* agent drawer */
#scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20}
#agent{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);z-index:21;background:var(--surface);border-left:1px solid var(--rule);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:580px){#agent{border-left:0;padding-left:env(safe-area-inset-left,0px)}}
.ag-h{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.ag-h .t{flex:1;min-width:0}
.ag-h h2{font-size:19px}
.ag-h .eyebrow{display:flex;align-items:center;gap:6px}
.icon-btn{border:0;background:var(--sunk);width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1;flex:none}
.modes{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--rule);overflow-x:auto}
.modes button{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.msg{min-width:0}
.msg.user{justify-self:end;max-width:85%;background:var(--accent-soft);padding:8px 12px;border-radius:12px 12px 4px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.sys{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg.err{color:var(--warn);font-size:14px}
.md{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-size:14px;font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:0 0 8px}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:2px 0}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.md pre{background:var(--sunk);padding:10px 12px;border-radius:8px;overflow-x:auto;margin:0 0 10px}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.5}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:0 0 10px;font-size:13px}
.md th,.md td{border:1px solid var(--rule);padding:4px 8px}
.md blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--rule);color:var(--muted)}
.thinking{color:var(--muted);font-size:14px}
.thinking i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-left:3px;animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}.bar>i{transition:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.chips button{border:1px dashed var(--rule);background:none;border-radius:99px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.chips button:hover{color:var(--accent);border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--rule);align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:14px;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);min-height:40px;max-height:140px}
.ag-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 12px;font-size:13px;flex-wrap:wrap}
.ag-foot label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ag-foot input{width:18px;height:18px;accent-color:var(--done);margin:0}
footer.site{padding-block:0 32px;font-size:12.5px;color:var(--muted)}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="brand-name">Sem 3 Sprint</span><span class="brand-sub" id="dayLabel"></span></div>
    <div class="overall" title="Topics and tasks ticked across all 15 days"><div class="bar"><i id="overallFill" style="width:0"></i></div><span id="overallText" class="mono"></span></div>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="today" id="tab-today">Day plan</button>
    <button role="tab" data-view="plan" id="tab-plan">15-day plan</button>
    <button role="tab" data-view="subjects" id="tab-subjects">Subjects</button>
  </nav>
</header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section id="view-today" role="tabpanel" aria-labelledby="tab-today"></section>
  <section id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
  <section id="view-subjects" role="tabpanel" aria-labelledby="tab-subjects" hidden></section>
</main>
<footer class="wrap site"><span id="saveState">Loading your progress…</span> Exam dates, marks and weightage aren't known yet; priority topics and viva questions are inferred from the portal topic names.</footer>

<div id="scrim" hidden></div>
<aside id="agent" hidden aria-label="Study tutor" role="dialog" aria-modal="true">
  <div class="ag-h">
    <div class="t">
      <div class="eyebrow" id="agSubj"></div>
      <h2 id="agTitle"></h2>
    </div>
    <button class="icon-btn" id="agClose" aria-label="Close tutor">×</button>
  </div>
  <div class="modes" id="agModes" role="group" aria-label="Tutor mode">
    <button data-mode="explain">Explain simply</button>
    <button data-mode="exam">Exam answer</button>
    <button data-mode="quiz">Quiz me</button>
    <button data-mode="viva">Viva</button>
  </div>
  <div id="msgs" aria-live="polite"></div>
  <div class="chips" id="agChips"></div>
  <form class="composer" id="agForm">
    <textarea id="agInput" rows="1" placeholder="Ask a follow-up…" aria-label="Message to tutor"></textarea>
    <button type="submit" class="btn primary" id="agSend">Send</button>
  </form>
  <div class="ag-foot">
    <label id="agDoneWrap"><input type="checkbox" id="agDone"> <span>Mark this topic done</span></label>
    <button class="btn" id="agRedo" type="button">Start over</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- syllabus + plan ---------- */
const START = new Date(2026, 10, 23); // Day 1 = Mon 23 Nov 2026
const DAYS = 15, LEARN_DAYS = 12;

const SUBJ = {
  DAA:{name:"Design & Analysis of Algorithms",c:"var(--daa)",portal:"27%",
    style:"coding problems in Python: the approach, the code, and time/space complexity",
    special:"## Approach and code\nPlain-language steps first. Then short Python code with comments. Then time and space complexity, each with a one-line reason."},
  PS:{name:"Probability & Statistics",c:"var(--ps)",portal:"14%",
    style:"numericals solved by hand step by step, plus Python implementation in the lab",
    special:"## Formula and when to use it\nSay what each symbol means in words, when to use the formula and when not to. If it fits, add a 3 to 5 line Python (numpy/scipy) version."},
  BE:{name:"Back End Development",c:"var(--be)",portal:"Node JS 19% · More NodeJS 1% · MongoDB 6%",
    style:"Node.js, Express and MongoDB: theory questions plus JavaScript code the student must explain",
    special:"## Code\nA minimal Node.js / Express / Mongoose example in JavaScript with comments, and what each part does."},
  AIF:{name:"AI for Finance",c:"var(--aif)",portal:"25%",
    style:"concepts plus building LLM apps in Python: RAG, agents, LangSmith, fraud models, guardrails",
    special:"## How it works\nThe pipeline or process as numbered steps. Add a tiny Python sketch only if it helps."},
  LR:{name:"Logical Reasoning",c:"var(--lr)",portal:"30%",
    style:"multiple-choice reasoning questions where speed matters",
    special:"## Fastest method\nThe step-by-step method or shortcut that works every time, and how to draw it on rough paper (table, family tree, Venn diagram)."},
  COM:{name:"Advanced Communication",c:"var(--com)",portal:"21%",
    style:"spoken and written English: interviews, group discussions, presentations; marked on practice",
    special:"## Phrases to use\n5 to 8 useful phrases or sentence patterns. Then a short model answer (60 to 90 words) the student can copy the style of."},
  ALL:{name:"All subjects",c:"var(--all)",portal:"",style:"mixed: numericals (PS, LR), code (DAA, BE), concepts (AIF), speaking (COM)",special:""}
};
const ORDER = ["DAA","PS","BE","AIF","LR","COM"];

const VIVA = {
  PS:["Difference between population and sample?","Mean vs median vs mode: when to use each?","What does standard deviation tell you?","State Bayes' theorem with an example.","Binomial vs Poisson distribution?","What is the central limit theorem?","What does a p-value mean?","When do you use a t-test instead of a z-test?","What does ANOVA test?","Explain your Python implementation of a hypothesis test. [lab]"],
  DAA:["Array vs linked list: trade-offs?","How does hashing give O(1) average lookup?","Explain sliding window with an example.","How do you detect a cycle in a linked list?","Stack vs queue: real-world uses?","Convert an infix expression to postfix.","BFS vs DFS traversal of a tree?","What property makes a tree a BST?","Time complexity of heapsort, and why?","Walk through your Kth-largest-element code. [lab]"],
  COM:["Introduce yourself in 60 seconds.","Tell me about your Communication project. [project]","How do you keep a group discussion on track?","Rephrase this sentence more formally.","What makes a question open vs closed?","How do you handle hesitation while speaking?","Use 'might', 'must' and 'should' in sentences.","How do you structure a 5-minute presentation?","Answer: 'What is your biggest weakness?'","What did you practise in the Real Time Sessions? [lab]"],
  BE:["What is Node.js and why is it non-blocking?","Explain the HTTP request-response cycle.","What is Express middleware?","Name the REST methods and what each does.","Authentication vs authorization?","How does a JWT work?","What is MVC and why use it?","What is a Mongoose schema/model?","Streams vs reading a whole file: why?","Walk through your CRUD API code. [lab]"],
  LR:["How do you approach a seating arrangement problem?","Solve a 3-generation blood relation question aloud.","What does 'some A are B' allow you to conclude?","When is a Venn diagram the right tool?","How do you count faces of a painted cube?","What makes data 'sufficient'?","Your method for counting triangles in a figure?","How do you avoid traps in syllogism questions?","How do you spot a pattern in visual series?","Explain your approach to a puzzle from the daily practice. [lab]"],
  AIF:["What is RAG and why use it in finance?","How do you evaluate a RAG system?","How does your personal finance advisor work? [lab]","What tools does your trading agent use? [lab]","What is LLM observability?","What does LangSmith trace?","Which metrics matter for fraud detection, and why not accuracy?","Responsible AI vs AI ethics?","What is a guardrail? Give an example.","Explain your course project architecture. [project]"]
};

// [day, unit, topics, mode?]  mode: learn (default) | coach
const LEARN = {
  DAA:[
    [1,"U1 Hashing, Sliding Window & Two-Pointer",["Hashing","Prefix sum","Sliding window","Two-pointer technique","Longest subarray with sum K","Largest subarray sum","Two Sum"]],
    [2,"U2 Linked Lists",["Singly list insert/delete","Doubly list insert/delete","Circular linked list","Reverse a linked list"]],
    [3,"U2 Linked Lists",["Cycle detection & length","Add two numbers","Merge two sorted lists","Intersection of two lists","Flatten a linked list"]],
    [4,"U3 Stacks & Queues",["Stack via array/linked list","Queue via array/linked list","Stack using queue","Queue using stack","Min stack"]],
    [5,"U3 Stacks & Queues",["Balanced parentheses","Infix/prefix/postfix notation","Monotonic stack","Next greater element"]],
    [6,"U3 Stacks & Queues",["Asteroid collision","Largest rectangle in histogram"]],
    [6,"U4 Trees & BSTs",["Pre/in/post-order traversal"]],
    [7,"U4 Trees & BSTs",["Level order traversal","Height & balanced tree","Diameter of binary tree","Maximum path sum"]],
    [8,"U4 Trees & BSTs",["Top / right view","Lowest common ancestor","BST insert/delete"]],
    [9,"U4 Trees & BSTs",["Kth smallest in BST","Validate a BST","BST predecessor/successor","Merge two BSTs"]],
    [10,"U5 Heaps",["Binary heap implementation","Heapsort","Max heap validation","Convert min to max heap"]],
    [11,"U5 Heaps",["Kth largest element","Merge K sorted arrays","Top K frequent elements"]],
    [12,"Redo",["Redo the DAA problems from Days 1–11 you couldn't solve alone"],"coach"]
  ],

function isoToday(){ const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
const rotSubj = d => d % 2 ? "BE" : "AIF";
function durLabel(m){ if (!m) return ""; const h = Math.floor(m/60), r = m % 60; const t = (h ? h + " h" : "") + (r ? (h ? " " : "") + r + " min" : ""); const p = Math.round(m/60); return m >= 60 ? `${t} · ${p} × 50/10` : t; }

const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
let col = null, writing = false, dirty = false, storeMode = "pending";

function setSaveState(t){ $("#saveState").textContent = t; }

async function initStore(){
  const [db, user] = await Promise.all([use("db"), use("user")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { storeMode = "local"; setSaveState("Progress is saved in this browser only."); return; }
  try { col = db.collection("data/users/" + uid); } catch(e){ storeMode = "local"; setSaveState("Progress is saved in this browser only."); return; }
  storeMode = "db";
  let settled = false;
  const timer = setTimeout(() => { if (!settled) setSaveState("Can't reach your saved progress yet. Ticks are kept in this browser until it connects."); }, 10000);
  col.onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) {
      const data = d.data() || {};
      if (d.id === "progress") { const nd = data.done || {}; if (!writing && !dirty && JSON.stringify(nd) !== JSON.stringify(state.done)) { state.done = Object.assign({}, nd); changed = true; } }
      else if (d.id.startsWith("note-") && typeof data.text === "string") { const tid = d.id.slice(5); if (state.notes[tid] !== data.text) { state.notes[tid] = data.text; changed = true; } }
    }
    if (!snap.metadata.fromCache && !settled) { settled = true; clearTimeout(timer); setSaveState("Progress is saved to your Claude account."); }
    if (changed) { lsWrite(); renderAll(); }
  }, err => {
    settled = true; clearTimeout(timer);
    storeMode = "local"; col = null;
    setSaveState("Saved progress isn't available right now. Ticks are kept in this browser.");
  });
}

async function flushProgress(){
  lsWrite();
  if (storeMode !== "db" || !col) return;
  if (writing) { dirty = true; return; }
  writing = true;
  try {
    do { dirty = false; await col.doc("progress").set({done:Object.assign({}, state.done)}); } while (dirty);
  } catch(e) {
    dirty = false;
    setSaveState(e && e.code === "quota_exceeded" ? "Storage is full; ticks are kept in this browser only." : "Couldn't save that tick to your account; it is kept in this browser.");
  } finally { writing = false; }
}
async function saveNote(id, text){
  state.notes[id] = text; lsWrite();
  if (storeMode === "db" && col) { try { await col.doc("note-" + id).set({text}); } catch(e){} }
}

function setDone(id, on){
  if (on) state.done[id] = isoToday(); else delete state.done[id];
  flushProgress();
  syncTicks(id);
}

}

function renderToday(){

const BASE = `You are a friendly, direct tutor helping a college student in India get exam-ready for Semester 3 in a 15-day sprint. Write in simple English: short sentences, everyday words, and explain any technical word the first time in a few words. No filler and no praise. Use Markdown headings and bullet points. Write formulas in plain text (for example P(A|B) = P(A and B) / P(B)) and code in fenced code blocks. If something depends on the student's specific course material and you are not sure, say so instead of guessing.`;

function ctx(item){
  const s = SUBJ[item.subj];
  return `Subject: ${s.name} (${item.subj}). How this subject is tested: ${s.style}.` + (item.unit && item.unit !== "Revision" ? `\nUnit: ${item.unit}` : "") + `\nTopic: ${item.name}`;
}
function rulesFor(item, mode){
  const s = SUBJ[item.subj];
  if (mode === "explain") return `${BASE}\n\n${ctx(item)}\n\nTask: explain this topic so the student understands it and can answer exam and viva questions on it. Use exactly these sections:\n## In one line\n## Simple analogy\n## Core idea\n(3 to 6 bullets)\n${s.special}\n## Worked example\n(step by step, with small round numbers or a tiny input)\n## Common mistakes\n(2 or 3 bullets)\n## Likely exam question\n(one question, then a model answer in 4 to 6 lines)\n## Check yourself\n(3 short numbered questions, without answers${item.subj === "COM" ? "; make the last one a short speaking or writing task" : ""})\nKeep it under 500 words.\n\nLater in this chat: if the student answers the check questions, mark each one Correct, Partly or Wrong with a one-line reason and give the right answer. If they ask for something simpler or another example, give it briefly.`;
  if (mode === "exam") return `${BASE}\n\n${ctx(item)}\n\nTask: show how to write a strong exam answer on this topic.\n## 2-mark answer\n(2 to 3 lines)\n## 5-mark answer\n(points, plus the formula, diagram description or code to include, and an example)\n## 10-mark answer outline\n(headings, key points, what examiners look for)\n## Keywords to use\nKeep it under 500 words. The student may ask follow-ups after.`;
  if (mode === "quiz") return `${BASE}\n\n${ctx(item)}\n\nTask: quiz the student on this topic. Ask 5 questions, ONE at a time, mixed difficulty, in the style this subject is tested (${s.style}). Ask question 1 now and stop. After each answer: say Correct, Partly or Wrong, explain in 1 or 2 lines, then ask the next question. If the student asks for a hint, give a small one. After question 5: the score out of 5, the weakest point, and what to revise.`;
  if (mode === "viva") return `${BASE}\n\n${ctx(item)}\n\nTask: act as a strict but fair viva examiner. Ask one viva question on this topic now and stop. After each answer: a score out of 10, what was missing, a short model answer (4 to 6 lines), then one follow-up question that goes one level deeper. Stop after 5 questions with an overall score and the 2 weakest points.`;
  if (mode === "sviva") {
    const bank = VIVA[item.subj].map((q, k) => `${k + 1}. ${q}`).join("\n");
    return `${BASE}\n\nSubject: ${s.name} (${item.subj}).\n\nTask: run a full mock viva as a strict but fair examiner. Use this question bank, in random order, ONE question at a time, and add short follow-ups on weak answers:\n${bank}\nFor [lab] and [project] questions, ask the student to walk you through their own code or project and probe why they made each choice.\nAsk the first question now and stop. After each answer: a score out of 10, what was missing, and a short model answer (3 to 5 lines), then the next question. At the end: the average score and the 3 weakest areas, each with the unit to revise.`;
  }
  if (mode === "quiz-all") return `${BASE}\n\nTask: "${item.name}". Cover all six subjects: Probability & Statistics, Design & Analysis of Algorithms, Back End Development (Node/Express/MongoDB), AI for Finance, Logical Reasoning, Advanced Communication. Ask ONE question at a time, in each subject's own style (numericals for PS and LR, code or complexity for DAA and BE, concepts for AIF, a speaking task for COM). Ask the first question now and stop. After each answer: Correct, Partly or Wrong with a one-line reason, then the next question. At the end: score per subject and the 3 weakest areas.`;
  if (mode === "review") return `${BASE}\n\nTask: spaced-repetition review. The student studied these topics earlier in the sprint:\n${item.topics.map(t => `- ${t.subj}: ${t.name}`).join("\n")}\n\nAsk 6 quick recall questions, ONE at a time, spread across different subjects and topics. Ask question 1 now and stop. After each answer: Correct, Partly or Wrong with a one-line reason and the right answer, then the next question. At the end: the score out of 6 and which topics to look at again.`;
  // coach
  return `${BASE}\n\nSubject: ${s.name}.\n\nTask: the student's revision task today is: "${item.name}". Give a short time-boxed plan for it (3 to 5 steps). Then start step 1 with them: give the first problem, question or instruction and stop to wait for their work. After each attempt: say what is right, what is wrong and why, then move on. For coding, ask for the approach and complexity before code, and review their code instead of rewriting it.`;
}
const CHIPS = {
  explain: item => ["Explain it even simpler", "Give another example", ...(item.subj === "PS" ? ["Give me a numerical to solve"] : []), ...(["DAA","BE"].includes(item.subj) ? ["Walk through the code line by line"] : []), ...(item.subj === "LR" ? ["Give me 3 practice questions"] : []), ...(item.subj === "COM" ? ["Give me a speaking task"] : [])],
  exam: () => ["Give me a practice question", "Mark my answer"],
  quiz: () => ["Give me a hint", "I don't know, show me"],
  viva: () => ["Give me a hint", "I don't know, show me"],
  sviva: () => ["Give me a hint", "Skip this question"],
  "quiz-all": () => ["Give me a hint", "Skip this question"],
  review: () => ["Give me a hint", "I don't know, show me"],
  coach: () => ["Give me a hint", "Show me the answer", "Next step"]
};
const ERR = {
  rate_limited:"Too many requests right now, or you've reached your usage limit. Wait a little, then try again.",
  session_expired:"Your claude.ai sign-in expired. Sign in again, then try again.",
  refused:"Claude couldn't answer that. Try asking it a different way.",
  empty_completion:"No answer came back. Try again, or ask for less at once.",
  prompt_too_large:"This chat got too long. Press Start over.",
  upstream_error:"The answer didn't come through. Try again."
};
const OFF_CODES = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];

function md(text){
  try { if (window.marked && window.DOMPurify) return window.DOMPurify.sanitize(window.marked.parse(text)); } catch(e){}
  return esc(text).replace(/\n/g, "<br>");
}
function addMsg(kind, html){
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (kind === "user") el.textContent = html; else el.innerHTML = html;
  $("#msgs").appendChild(el);
  scrollMsgs(true);
  return el;
}
function scrollMsgs(force){
  const m = $("#msgs");
  if (force || m.scrollHeight - m.scrollTop - m.clientHeight < 120) m.scrollTop = m.scrollHeight;
}
function setBusy(b){
  agent.busy = b;
  const send = $("#agSend");
  send.textContent = b ? "Stop" : "Send";
  send.classList.toggle("primary", !b);
  for (const c of document.querySelectorAll("#agChips button")) c.disabled = b;
}
function trimTurns(turns){
  // keep the instructions turn + the most recent turns under ~120 KB
  let t = turns.slice();
  while (t.length > 3 && JSON.stringify(t).length > 120000) t.splice(1, 2);
  if (t[1] && t[1].role === "assistant" && t.length > 2) { /* fine: consecutive roles allowed */ }
  return t;
}
async function ask({fresh}){
  if (agent.busy) return;
  const s = sampleFn || await samplePromise;
  if (!s || agentOff) { addMsg("err", esc("The tutor is off on this page for your account. Use the plan here, and ask Claude in a normal chat; the study-os skill knows this plan.")); return; }
  const ctl = new AbortController(); agent.ctl = ctl;
  const item = agent.item, mode = agent.mode;
  const out = addMsg("ai md", `<span class="thinking">Thinking<i></i><i></i><i></i></span>`);
  setBusy(true);
  let raf = 0, latest = "";
  const paint = () => { raf = 0; out.innerHTML = md(latest); scrollMsgs(false); };
  try {
    const res = await s(trimTurns(agent.turns), {
      signal: ctl.signal,
      cache: fresh ? false : (agent.turns.length === 1 ? true : false),
      onText: ({text}) => { latest = text; if (!raf) raf = requestAnimationFrame(paint); }
    });
    if (agent.ctl !== ctl) return;
    latest = res.text; if (raf) cancelAnimationFrame(raf); paint();
    agent.turns.push({role:"assistant", content:res.text});
    if (res.truncated) addMsg("sys", "The answer was cut short. Ask it to continue.");
    if (mode === "explain" && item.mode === "learn" && agent.turns.length === 2 && !res.truncated) { await saveNote(item.id, res.text); markNoteTags(item.id); }
  } catch(e) {
    if (raf) cancelAnimationFrame(raf);
    if (agent.ctl !== ctl) return;
    const code = e && e.code;
    if (code === "cancelled") { if (e.text) { out.innerHTML = md(e.text); agent.turns.push({role:"assistant", content:e.text}); } else out.remove(); }
    else if (OFF_CODES.includes(code)) { out.remove(); agentOff = true; addMsg("err", esc("The tutor is off for this page (it wasn't allowed, or Claude isn't available on this account). The plan and ticks still work.")); }
    else {
      if (code === "refused" || !e.text) out.remove(); else { out.innerHTML = md(e.text); agent.turns.push({role:"assistant", content:e.text}); }
      addMsg("err", esc(ERR[code] || ERR.upstream_error));
    }
  } finally {
    if (agent.ctl === ctl) { agent.ctl = null; setBusy(false); }
  }
}
function markNoteTags(id){ if (state.view === "today") renderToday(); else if (state.view === "subjects") renderSubjects(); }

let lastFocus = null;
function openAgent(item, mode){
  lastFocus = document.activeElement;
  agent.ctl && agent.ctl.abort();
  agent.item = item;
  const isLearn = item.mode === "learn";
  agent.mode = mode || (isLearn ? "explain" : item.mode === "sviva" ? "sviva" : item.mode === "quiz" ? (item.subj === "ALL" ? "quiz-all" : "quiz") : item.mode === "review" ? "review" : "coach");
  $("#agSubj").innerHTML = `<span class="dot" style="--c:${SUBJ[item.subj] ? SUBJ[item.subj].c : "var(--all)"}"></span>${esc(item.subj === "ALL" ? "All subjects" : SUBJ[item.subj].name)}${item.unit && item.unit !== "Revision" ? " · " + esc(item.unit) : ""}`;
  $("#agTitle").textContent = item.name;
  $("#agModes").hidden = !isLearn;
  $("#agDoneWrap").hidden = !item.id;
  $("#agDone").checked = !!(item.id && state.done[item.id]);
  $("#agent").hidden = false; $("#scrim").hidden = false;
  document.body.style.overflow = "hidden";
  startMode(false);
  $("#agClose").focus();
}
function startMode(fresh){
  agent.ctl && agent.ctl.abort();
  agent.ctl = null; setBusy(false);
  const item = agent.item, mode = agent.mode;
  for (const b of document.querySelectorAll("#agModes button")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  $("#msgs").innerHTML = "";
  $("#agChips").innerHTML = (CHIPS[mode] || (() => []))(item).map(c => `<button type="button">${esc(c)}</button>`).join("");
  $("#agInput").placeholder = mode === "explain" ? "Answer the check questions, or ask a follow-up…" : mode === "exam" ? "Ask a follow-up, or paste your answer to get it marked…" : "Type your answer…";
  agent.turns = [{role:"user", content:rulesFor(item, mode)}];
  const label = {explain:"Explain simply", exam:"Exam answer", quiz:"Quiz: 5 questions", viva:"Viva: up to 5 questions", sviva:"Full mock viva: 10 questions", "quiz-all":"Mixed quiz", review:"Spaced review: 6 questions", coach:"Revision coach"}[mode];
  if (mode === "explain" && !fresh && item.id && state.notes[item.id]) {
    addMsg("sys", `<span>${esc(label)} · saved explanation</span>`);
    const el = addMsg("ai md", md(state.notes[item.id]));
    agent.turns.push({role:"assistant", content:state.notes[item.id]});
    $("#msgs").scrollTop = 0; void el;
    return;
  }
  addMsg("sys", `<span>${esc(label)}</span>`);
  ask({fresh});
}
function closeAgent(){
  agent.ctl && agent.ctl.abort();
  agent.ctl = null;
  $("#agent").hidden = true; $("#scrim").hidden = true;
  document.body.style.overflow = "";
  agent.item = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function sendText(text){
  text = text.trim(); if (!text || agent.busy || !agent.item) return;
  addMsg("user", text);
  agent.turns.push({role:"user", content:text});
  $("#agInput").value = ""; autosize();
  ask({fresh:true});
}
function autosize(){ const t = $("#agInput"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }

/* ---------- events ---------- */
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.tick;
  if (id) setDone(id, e.target.checked);
  if (e.target.id === "agDone" && agent.item && agent.item.id) setDone(agent.item.id, e.target.checked);
});
document.addEventListener("click", e => {
  const b = e.target.closest("button, tr[data-goday]");
  if (!b) return;
  if (b.dataset.view) return setView(b.dataset.view);
  if (b.dataset.day) { state.day = +b.dataset.day; renderToday(); const f = document.querySelector(`.daychip[data-day="${state.day}"]`); f && f.focus(); return; }
  if (b.dataset.goday) { state.day = +b.dataset.goday; setView("today"); window.scrollTo(0, 0); return; }
  if (b.dataset.open) return openAgent(BYID[b.dataset.open]);
  if (b.dataset.sviva) return openAgent({id:null, subj:b.dataset.sviva, name:`Full mock viva: ${b.dataset.sviva}`, mode:"sviva"});
  if (b.dataset.review) {
    const d = +b.dataset.review;
    const topics = reviewDue(d).flatMap(g => g.items);
    return openAgent({id:null, subj:"ALL", name:`Spaced review for Day ${d}`, mode:"review", topics});
  }
  if (b.dataset.mode && b.closest("#agModes")) { if (agent.mode !== b.dataset.mode) { agent.mode = b.dataset.mode; startMode(false); } return; }
  if (b.closest("#agChips")) return sendText(b.textContent);
  if (b.id === "agClose") return closeAgent();
  if (b.id === "agRedo") return startMode(true);
  if (b.id === "agSend" && agent.busy) { e.preventDefault(); agent.ctl && agent.ctl.abort(); return; }
});
$("#scrim").addEventListener("click", closeAgent);
$("#agForm").addEventListener("submit", e => { e.preventDefault(); if (agent.busy) { agent.ctl && agent.ctl.abort(); return; } sendText($("#agInput").value); });
$("#agInput").addEventListener("input", autosize);
$("#agInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover:hover)").matches) { e.preventDefault(); $("#agForm").requestSubmit(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#agent").hidden) closeAgent(); });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (["today","plan","subjects"].includes(v) && v !== state.view) setView(v); });

function showBanner(t){ const b = $("#banner"); b.textContent = t; b.hidden = false; }

/* ---------- boot ---------- */
let startView = location.hash.slice(1);
if (!["today","plan","subjects"].includes(startView)) { try { startView = localStorage.getItem(LS_KEY + ":view") || "today"; } catch(e){ startView = "today"; } }
if (!["today","plan","subjects"].includes(startView)) startView = "today";
setView(startView);
initStore();
})();
</script>
